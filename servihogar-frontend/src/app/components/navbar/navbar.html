<nav class="navbar" aria-label="Navegación principal">
  <div class="container navbar-inner">
    <a routerLink="/inicio" class="navbar-brand">
      <span class="brand-icon">SH</span>
      ServiHogar
    </a>
    <ul class="navbar-links">
      <li>
        <a
          routerLink="/inicio"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Inicio
        </a>
      </li>
      <li>
        <a routerLink="/buscar-tecnicos" routerLinkActive="active">Buscar técnicos</a>
      </li>
      <li class="navbar-links-secondary">
        <a routerLink="/inicio" fragment="servicios">Servicios</a>
      </li>
      <li class="navbar-links-secondary">
        <a routerLink="/inicio" fragment="como-funciona">Cómo funciona</a>
      </li>
      <li class="navbar-links-secondary">
        <a routerLink="/inicio" fragment="nosotros">Nosotros</a>
      </li>
    </ul>
    <div class="navbar-actions">
      @if (isLoggedIn()) {
        @if (panelRoute(); as route) {
          <a [routerLink]="route" class="navbar-user">{{ displayName() }}</a>
          <a [routerLink]="route" class="btn-nav-outline">Mi panel</a>
        } @else {
          <button type="button" class="navbar-user navbar-user-btn" (click)="irAMiPanel()">
            {{ displayName() }}
          </button>
          <button type="button" class="btn-nav-outline" (click)="irAMiPanel()">Mi panel</button>
        }
        @if (pendingMessage()) {
          <span class="navbar-pending-msg" role="status">{{ pendingMessage() }}</span>
        }
        <button type="button" class="btn-nav-outline" (click)="cerrarSesion()">
          Cerrar sesión
        </button>
      } @else {
        <a routerLink="/login" class="btn-nav-outline">Iniciar sesión</a>
        <a routerLink="/login" [queryParams]="{ tab: 'register' }" class="btn-nav-register">Registrarse</a>
      }
    </div>
  </div>
</nav>
